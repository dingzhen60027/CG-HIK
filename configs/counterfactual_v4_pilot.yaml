protocol_version: 4
experiment_name: counterfactual_v4_latency_label_pilot
workspace: ..
source_config: paper_v2.yaml
release_root: ../outputs/release_v3_locked
output_root: ../outputs/counterfactual_v4_pilot

# The first cost/label-quality pilot intentionally uses one frozen training
# seed. Other seeds are sensitivity runs after this pilot clears its exit audit.
robots: [panda, ur5e]
training_seeds: [17]

data:
  # Validation/pilot is permitted for cost and label-schema selection. The
  # formal bulk label set will use risk_train_queries after this pilot.
  source_role: risk_validation_queries
  pilot_count: 2000
  dt: 0.02

timing:
  warmup_iterations: 200
  repeats: 5
  deadline_ms: 20.0

runtime:
  device: cuda:0
  intra_op_threads: 8
  inter_op_threads: 1
  max_unrelated_cpu_percent: 50.0
  environment_check_every_queries: 25

logging:
  progress_every: 100
