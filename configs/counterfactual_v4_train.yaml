protocol_version: 4
experiment_name: counterfactual_v4_validation_training
workspace: ..
bulk_root: ../outputs/counterfactual_v4_bulk
output_root: ../outputs/release_v4_candidate

# Frozen development roles. No test role is accepted by the runner.
robots: [panda, ur5e]
training_seed: 17
roles:
  train: risk_train_queries
  calibration: calibration_queries
  policy_selection: policy_validation_queries

model:
  hidden_sizes: [32, 32]
  epochs: 120
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  success_loss_weight: 1.0
  latency_loss_weight: 1.0
  fail_all_loss_weight: 1.0
  gradient_clip_norm: 5.0
  min_latency_ms: 0.0001
  min_quantile_gap_ms: 0.00001
  seed: 1704

calibration:
  method: platt

ood:
  method: embedding_mahalanobis
  fit_role: risk_train_queries
  threshold_role: calibration_queries
  target_id_coverage: 0.99
  shrinkage: 0.05

# This finite grid is locked before policy-validation labels are opened.
policy_grid:
  minimum_success_probabilities: [0.50, 0.60, 0.70, 0.80, 0.85, 0.90, 0.95]
  reject_probabilities: [0.70, 0.80, 0.85, 0.90, 0.95, 0.98]
  latency_tie_margins_ms: [0.0, 0.05, 0.10, 0.15, 0.25, 0.50]
  deadline_ms: 20.0
  hard_gates:
    verified_success_difference_vs_fixed_minimum: -0.01
    fixed_success_false_reject_rate_maximum: 0.01
    operational_feasible_false_reject_rate_maximum: 0.01

runtime:
  device: cpu
  intra_op_threads: 8
  inter_op_threads: 1
  deterministic_algorithms: true
