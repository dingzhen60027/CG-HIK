protocol: revision_compute_allocation_supplementary_v1
source_config: configs/paper_v2.yaml
output: outputs/revision_compute_allocation
robots: [panda, ur5e]
device: cuda:0
cpu_threads: 8
dt: 0.02
deadline_ms: 20
point_seeds: {panda: 960601, ur5e: 960602}
trajectory_seeds: {panda: 960611, ur5e: 960612}
smoke_seeds: {panda: 960621, ur5e: 960622}
point_counts: {local: 1000, near_singular: 500, near_limit: 500, hard_feasible: 500, constructed_inexecutable: 500}
point_repeats: 3
oracle_counts: {local: 200, near_singular: 100, near_limit: 100, hard_feasible: 100}
oracle_repeats: 10
trajectories_per_family: 10
trajectory_frames: 150
trajectory_families: [smooth, near_singular, joint_limit_return, high_curvature]
geometry_position_grid_m: [0.002, 0.005, 0.01, 0.02, 0.04]
geometry_orientation_grid_rad: [0.01, 0.025, 0.05, 0.10, 0.20]
geometry_selection: maximum_existing_label_success_then_minimum_p95_then_mean_latency_then_smallest_thresholds
geometry_selection_role: calibration_queries
trac_ik:
  repository: https://github.com/traclabs/trac_ik.git
  mode: Speed
  budgets_ms: [5, 20, 100, 400]
  internal_epsilon: 0.00001
  trajectory_selection_role: calibration_queries
  trajectory_selection_count: 120
  trajectory_selection: maximum_verified_success_then_minimum_total_time_then_smallest_budget
  joint_bounds: intersection_of_urdf_and_single_frame_velocity_interval
  continuous_joint_policy: wrapped_contract_interval_via_unwrapped_local_search_then_normalize
statistics:
  bootstrap_repeats: 4000
  seed: 960631
  interval: paired_family_stratified_percentile_95
  point_unit: query_with_repeats_kept_together
  trajectory_unit: complete_150_frame_trajectory
  multiplicity: descriptive_intervals_no_significance_claims
