protocol_version: 2
experiment_name: paper_v2
output_root: ../outputs
seed: 17
device: cuda

robots:
  ur5e:
    urdf: /home/eric/isaacsim/extsDeprecated/isaacsim.robot_motion.motion_generation/motion_policy_configs/universal_robots/ur5e/ur5e.urdf
    base_link: base_link
    end_link: tool0
  panda:
    urdf: /home/eric/isaacsim/exts/isaacsim.asset.importer.urdf/data/urdf/robots/franka_description/robots/panda_arm.urdf
    base_link: panda_link0
    end_link: panda_link8

data:
  dt: 0.02
  sigma_samples: 5000
  seed_train: {trajectories: 2000, steps_per_trajectory: 100, seed: 101, margin: 0.1}
  seed_validation: {trajectories: 200, steps_per_trajectory: 100, seed: 102, margin: 0.1}
  risk_train: {samples: 60000, seed: 201, challenge_fraction: 0.55, hard_valid_fraction: 0.15}
  risk_validation: {samples: 15000, seed: 202, challenge_fraction: 0.55, hard_valid_fraction: 0.15}
  calibration: {samples: 15000, seed: 203, challenge_fraction: 0.55, hard_valid_fraction: 0.15}
  policy_validation: {samples: 15000, seed: 204, challenge_fraction: 0.55, hard_valid_fraction: 0.15}
  risk_test: {samples: 20000, seed: 205, challenge_fraction: 0.55, hard_valid_fraction: 0.15}
  test_id: {trajectories: 5000, steps_per_trajectory: 1, seed: 301, margin: 0.1}

seed_model:
  members: 5
  hidden_sizes: [256, 256, 256]
  max_delta: 0.25
  epochs: 30
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.00001
  joint_loss_weight: 1.0
  fk_position_weight: 0.1
  fk_orientation_weight: 0.1
  seed: 17

seed_validation: {pose_samples: 2000}

solver:
  position_tolerance: 0.001
  orientation_tolerance: 0.00872664626
  lambda_min: 0.0001
  lambda_max: 0.1
  max_joint_step: 0.1
  orientation_weight: 0.35

verifier:
  position_tolerance: 0.001
  orientation_tolerance: 0.00872664626
  joint_limit_tolerance: 0.000000001
  velocity_tolerance: 0.0001
  enforce_velocity: true

cascade:
  easy_iterations: 1
  medium_iterations: 1
  hard_iterations: 25
  hard_learned_candidates: 1
  fallback_seed_count: 2
  escalate_on_failure: true

action_gate:
  easy_probability: 0.70
  hard_probability: 0.45
  reject_probability: 0.85

threshold_guard:
  quantile_grid: [0.99, 0.995, 0.9975, 0.999, 0.9995, 1.0]

policy_selection:
  max_false_reject_rate: 0.01
  min_reject_recall: 0.95
  easy_probability_grid: [0.60, 0.70, 0.80]
  hard_probability_grid: [0.35, 0.45, 0.55]
  reject_probability_grid: [0.80, 0.85, 0.90, 0.95, 0.99]

fallback:
  position_tolerance: 0.001
  orientation_tolerance: 0.00872664626
  orientation_weight: 0.35
  max_function_evaluations: 100

ablations:
  enabled: true
  fixed_damping: 0.01

evaluation:
  cpu_threads: 1
  warmup_iterations: 200
  timing_repeats: 5
  synchronize_cuda: true
  method_order_seed: 9100
  seed_bank_size: 100000
  id_count: 5000
  per_stress_category: 1000
  hard_valid_count: 2000
  hard_valid_seed: 9010
  test_seed: 9001
  bootstrap_samples: 10000
  reference_trajectories:
    paths_per_type: 10
    steps: 150
    seed: 9020
