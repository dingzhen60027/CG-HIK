  warmup_iterations: 5
  timing_repeats: 1
  seed_bank_size: 250
  id_count: 8
  per_stress_category: 3
  test_seed: 9001
  bootstrap_samples: 500
  paths:
    paths_per_type: 1
    steps: 8
    seed: 9002
    amplitude: 0.002
