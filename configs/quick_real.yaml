seed_model:
  members: 2
  hidden_sizes: [64, 64]
  max_delta: 0.25
  epochs: 2
  batch_size: 64
  learning_rate: 0.002
  weight_decay: 0.00001
  joint_loss_weight: 1.0
  fk_position_weight: 0.1
  fk_orientation_weight: 0.1
