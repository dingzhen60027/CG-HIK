data:
  dt: 0.02
  sigma_samples: 200
  seed_train: {trajectories: 30, steps_per_trajectory: 10, seed: 101, margin: 0.1}
  seed_validation: {trajectories: 5, steps_per_trajectory: 10, seed: 102, margin: 0.1}
  risk_train: {samples: 200, seed: 201, challenge_fraction: 0.7}
  risk_validation: {samples: 80, seed: 202, challenge_fraction: 0.7}
