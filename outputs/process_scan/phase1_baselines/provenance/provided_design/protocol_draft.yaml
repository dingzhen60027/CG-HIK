  ros_interface: ROS 2 Humble
  simulation: MuJoCo
  isolate_from_old_environment: true
  physics_dt_s: 0.001
  low_level_dt_s: 0.002
  controller: common torque-limited inverse-dynamics feedforward plus PD
  runtime_qpos_overwrite_allowed: false
  models:
  - panda
  - ur5e
  joint_speed_factor: 0.5
  joint_acceleration_default_rad_s2: 2.0
