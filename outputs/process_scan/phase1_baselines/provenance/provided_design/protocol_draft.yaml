    and timing
  parameter_provenance: All numeric process values below are proposed simulation assumptions,
    not a hardware specification
  roi_m:
  - 0.24
  - 0.16
  raster_pitch_m: 0.02
  directions:
  - u
  - v
  lines:
    u: 9
    v: 13
  continuous_turns: common_C2_surface_domain_connector
  scan_transition_tags: freeze_before_comparison
  scanner:
    model: geometric_line_profiler
    profiles_hz: 200
    nominal_standoff_m: 0.15
    standoff_range_m:
    - 0.145
    - 0.155
    max_incidence_deg: 10.0
    center_ray_path_error_m: 0.001
    line_orientation_error_deg: 5.0
    line_sign_equivalence: true
    unrestricted_roll: false
    width_at_nominal_m: 0.04
    rays_per_profile: 81
    normal_convention: outward surface normal; ray axis points towards object; incidence
      cosine=-dot(a,n)
  quality:
    max_along_scan_gap_m: 0.001
    coverage_area_grid_spacing_m: 0.001
    coverage_neighbor_radius_m: 0.00075
    min_valid_coverage_fraction: 0.99
    max_uncovered_connected_hole_diameter_m: 0.002
    planning_clearance_m: 0.005
    all_quality_evaluated_from: actual simulated feedback, raycasts, timestamps; not
      ideal plan
