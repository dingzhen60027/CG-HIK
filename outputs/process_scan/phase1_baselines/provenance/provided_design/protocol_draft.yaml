  model_commits: null
  controller_gains: null
  tool_mass_inertia_tcp: null
  calibration_required_fields:
  - model_commits
  - controller_gains
  - tool_mass_inertia_tcp
  real_hardware: NOT_CONFIRMED_AND_NOT_AUTHORIZED
