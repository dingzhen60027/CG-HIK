[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confik"
version = "0.1.0"
description = "Confidence-gated hybrid inverse kinematics research framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
paper = [
  "torch>=2.2",
  "pin>=3.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
]
test = ["pytest>=7.4"]

[project.scripts]
confik = "confik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

